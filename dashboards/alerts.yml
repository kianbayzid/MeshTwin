# Prometheus alert rules for MeshTwin. Loaded by the chart:
#   --set-file prometheus.rules=dashboards/alerts.yml   (the Makefile does this)
groups:
  - name: meshtwin
    rules:
      # Freshness: a summary older than 2x the schedule of the job that writes it
      # (deploy/helm/meshtwin/values.yaml: topology every 5 min -> topology, resilience;
      # propagation hourly -> residuals, surprising; placement hourly -> placement, coverage;
      # terrain-tiles daily -> terrain).
      # max by: each API replica exports the gauge; the newest view counts.
      # The gauge refreshes when an API replica reloads a summary; the readiness
      # probe (GET /api/v1/regions every 30 s) guarantees that without user traffic.
      - alert: MeshTwinSummaryStale
        expr: |
          (time() - max by (region, summary) (meshtwin_api_summary_generated_timestamp_seconds{summary=~"topology|resilience"})) > 2 * 300
          or
          (time() - max by (region, summary) (meshtwin_api_summary_generated_timestamp_seconds{summary=~"residuals|surprising|placement|coverage"})) > 2 * 3600
          or
          (time() - max by (region, summary) (meshtwin_api_summary_generated_timestamp_seconds{summary="terrain"})) > 2 * 86400
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.region }} {{ $labels.summary }}.json is {{ $value | humanizeDuration }} old"
          description: "Older than twice its CronJob schedule: check the analytics CronJob's last run (kubectl get jobs)."

      # Any rejected summary is a contract or privacy problem, not noise.
      - alert: MeshTwinSummaryValidationFailures
        expr: sum by (summary) (increase(meshtwin_api_summary_validation_failures_total[15m])) > 0
        labels: {severity: critical}
        annotations:
          summary: "API rejected {{ $labels.summary }} summaries in the last 15 min"
          description: "A summary failed the privacy/contract checks and is not served. See the API logs."

      - alert: MeshTwinIngesterDown
        expr: absent(up{component="ingester"} == 1)
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: "No ingester is up (scrape failing or pod missing)"
          description: "Packets are not being stored. Check the ingester pod and its readiness (/readyz)."

      - alert: MeshTwinIngesterBrokerDisconnected
        expr: max(meshtwin_ingest_mqtt_connected) == 0
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "Ingester is not subscribed to the MQTT broker"
          description: "Check the broker URL and credentials Secret; the ingester retries with backoff."

  # DDIL: S3 outages are buffered in the ingester's spool (PVC). These say
  # whether the buffer is coping; only eviction means data is actually lost.
  - name: meshtwin-ddil
    rules:
      - alert: MeshTwinStorageDown
        expr: max(meshtwin_ingest_storage_up) == 0
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "Ingester cannot reach S3; new files are going to the spool"
          description: "Nothing is lost yet. Check SeaweedFS (kubectl get pods) and the S3 Secret. Watch spool usage."

      - alert: MeshTwinSpoolNearlyFull
        expr: max(meshtwin_ingest_spool_bytes) > 0.8 * max(meshtwin_ingest_spool_max_bytes)
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "Spool is {{ $value | humanize1024 }}B, over 80% of SPOOL_MAX_BYTES"
          description: "At 100% the oldest spooled files are evicted (lost). Restore S3 or raise ingester.spool.maxBytes and the PVC size."

      - alert: MeshTwinSpoolEvicting
        expr: sum(increase(meshtwin_ingest_spool_evicted_files_total[15m])) > 0
        labels: {severity: critical}
        annotations:
          summary: "Spool evicted {{ $value | humanize }} files in 15 min: data is being lost"
          description: "The spool hit SPOOL_MAX_BYTES while S3 was unreachable, so the oldest data was dropped. Restore S3 first."

      - alert: MeshTwinSpoolStale
        expr: max(meshtwin_ingest_spool_oldest_age_seconds) > 3600
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "Oldest spooled file is {{ $value | humanizeDuration }} old"
          description: "Data older than 1 h is not in S3 yet, so analytics runs miss it. Check S3 and the drain rate (DRAIN_RATE_BYTES)."
