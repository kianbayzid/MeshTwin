# MeshTwin local stack. Pick ONE ingester profile:
#
#   docker compose --profile own-observer  up --build   # your observer -> local mosquitto -> ingester
#   docker compose --profile public-broker up --build   # community broker (needs a read account)
#   docker compose --profile replay        up --build   # replay a capture file, then exit
#
# Always started: seaweedfs (S3 on 127.0.0.1:8333) and the api (web console + REST on 127.0.0.1:8081).
# Secrets come from ./.env (copy .env.example; .env is git-ignored).
# Record raw traffic for the test capture: RECORD_FILE=/records/sea.ndjson docker compose ...
name: meshtwin

x-ingester: &ingester
  build: ../../ingest
  image: meshtwin/ingester:dev
  restart: unless-stopped
  depends_on:
    seaweedfs: {condition: service_healthy}
  ports: ["127.0.0.1:8080:8080"] # metrics + health; localhost only
  volumes:
    - ../../testdata/recorded/raw:/records # git-ignored: raw real data never enters the repo
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

x-s3-env: &s3-env
  S3_ENDPOINT: seaweedfs:8333
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:-meshtwin}
  S3_SECRET_KEY: ${S3_SECRET_KEY:-}

services:
  # Object store: SeaweedFS (official image, from its maintainer) in `weed mini`
  # mode: master + volume + filer + S3 in one process. The env vars seed the
  # one S3 identity and pre-create the bucket. Optional extras are switched off,
  # and so is telemetry (it phones home by default).
  seaweedfs:
    image: chrislusf/seaweedfs:4.52@sha256:57877e32bb90073b37dc109b438ba66e84fd5ed9ced5f5c04f56444ef243ce59
    user: "1000:1000" # the image's `seaweed` user; skips the entrypoint's root chown step
    # Without a secret SeaweedFS starts in "allow all" mode, so refuse to start instead.
    entrypoint: >
      sh -c 'test -n "$$AWS_SECRET_ACCESS_KEY" || { echo "set S3_SECRET_KEY in deploy/compose/.env"; exit 1; };
             exec /entrypoint.sh mini -dir=/data -webdav=false -admin.ui=false -s3.port.iceberg=0 -master.telemetry=false'
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-meshtwin}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-}
      S3_BUCKET: meshtwin
    ports: ["127.0.0.1:8333:8333"] # S3 API, localhost only
    volumes: [seaweedfs-data:/data]
    tmpfs: [/tmp] # weed's local gRPC sockets
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8333/healthz"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  # Read-only REST API + the web console (web/, built into the image) over the
  # analytics summaries in S3.
  api:
    build:
      context: ../../api
      additional_contexts: {web: ../../web} # console sources (api/Dockerfile)
    image: meshtwin/api:dev
    depends_on:
      seaweedfs: {condition: service_healthy}
    environment: *s3-env
    ports: ["127.0.0.1:8081:8080"] # the ingester has 8080
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  # --- Setting 1: your own observer -----------------------------------------
  # Point your observer (meshcoretomqtt, MQTT observer firmware, meshcore-ha)
  # at this broker: host = this machine's LAN IP, port 1883, the username and
  # password from .env. Already have a broker? Set MQTT_URL in
  # own-observer.env and don't start this service.
  mosquitto:
    image: eclipse-mosquitto:2.0.22@sha256:81a6193ae693942a3231cd3ac52875b02b7e3a19da671b2fb4b55cc874c5b279
    profiles: [own-observer]
    environment:
      OBSERVER_MQTT_USERNAME: ${OBSERVER_MQTT_USERNAME:-observer}
      OBSERVER_MQTT_PASSWORD: ${OBSERVER_MQTT_PASSWORD:-}
    command: >
      sh -c 'test -n "$$OBSERVER_MQTT_PASSWORD" || { echo "set OBSERVER_MQTT_PASSWORD in deploy/compose/.env"; exit 1; };
             mosquitto_passwd -b -c /mosquitto/data/pw "$$OBSERVER_MQTT_USERNAME" "$$OBSERVER_MQTT_PASSWORD" &&
             chown mosquitto:mosquitto /mosquitto/data/pw && chmod 0600 /mosquitto/data/pw &&
             exec mosquitto -c /mosquitto/config/mosquitto.conf'
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data # persisted QoS 1 queue
    ports: ["1883:1883"] # LAN-reachable so your observer can publish; do NOT port-forward this
    restart: unless-stopped

  ingester-observer:
    <<: *ingester
    profiles: [own-observer]
    env_file: [own-observer.env]
    volumes:
      - ../../testdata/recorded/raw:/records
      - ingester-spool:/spool # DDIL spool: survives container restarts
    environment:
      <<: *s3-env
      RECORD_FILE: ${RECORD_FILE:-}
      MQTT_USERNAME: ${OBSERVER_MQTT_USERNAME:-observer}
      MQTT_PASSWORD: ${OBSERVER_MQTT_PASSWORD:-}

  # --- Setting 2: public community broker -----------------------------------
  ingester-public:
    <<: *ingester
    profiles: [public-broker]
    env_file: [public-broker.env]
    environment:
      <<: *s3-env
      RECORD_FILE: ${RECORD_FILE:-}
      MQTT_USERNAME: ${PUBLIC_MQTT_USERNAME:-}
      MQTT_PASSWORD: ${PUBLIC_MQTT_PASSWORD:-}

  # --- Replay a capture (no radio, no broker) --------------------------------
  ingester-replay:
    <<: *ingester
    profiles: [replay]
    restart: "no" # batch: exits when the file is done
    volumes:
      - ../../testdata:/testdata:ro
    environment:
      <<: *s3-env
      MODE: replay
      REPLAY_FILE: ${REPLAY_FILE:-/testdata/recorded/sea-anon.ndjson}
      REPLAY_SPEED: ${REPLAY_SPEED:-0}
      RECORD_FILE: ""

volumes:
  seaweedfs-data:
  mosquitto-data:
  ingester-spool:
