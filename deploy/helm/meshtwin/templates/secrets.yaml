{{- /*
Generated secrets: random on first install, read back with `lookup` on upgrade
so they never change under running pods. `helm template` (no cluster) renders
fresh random values each time; that output is for review, not for applying.
*/ -}}
{{- define "meshtwin.keep" -}}
{{- $s := lookup "v1" "Secret" .ns .name -}}
{{- if and $s (index ($s.data | default dict) .key) -}}
{{ index $s.data .key }}
{{- else -}}
{{ .fallback | b64enc }}
{{- end -}}
{{- end -}}
{{- $ns := .Release.Namespace -}}
{{- if not .Values.s3.existingSecret }}
{{- $name := printf "%s-s3" .Release.Name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "meshtwin.labels" (dict "root" $ "component" "seaweedfs") | nindent 4 }}
type: Opaque
data:
  access-key: {{ "meshtwin" | b64enc }}
  # SeaweedFS seeds this identity on first start of an empty /data; keep it stable.
  secret-key: {{ include "meshtwin.keep" (dict "ns" $ns "name" $name "key" "secret-key" "fallback" (randAlphaNum 40)) }}
{{- end }}
---
{{- $gname := printf "%s-grafana" .Release.Name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $gname }}
  labels: {{- include "meshtwin.labels" (dict "root" $ "component" "grafana") | nindent 4 }}
type: Opaque
data:
  admin-password: {{ include "meshtwin.keep" (dict "ns" $ns "name" $gname "key" "admin-password" "fallback" (randAlphaNum 24)) }}
{{- if and .Values.ingester.enabled (not .Values.ingester.mqtt.existingSecret) }}
---
{{- $mname := printf "%s-mqtt" .Release.Name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $mname }}
  labels: {{- include "meshtwin.labels" (dict "root" $ "component" "ingester") | nindent 4 }}
type: Opaque
data:
  username: {{ .Values.ingester.mqtt.username | b64enc }}
  {{- if .Values.ingester.mqtt.password }}
  password: {{ .Values.ingester.mqtt.password | b64enc }}
  {{- else }}
  password: {{ include "meshtwin.keep" (dict "ns" $ns "name" $mname "key" "password" "fallback" (randAlphaNum 32)) }}
  {{- end }}
{{- end }}
