# golangci-lint v2. Kept small: the standard set plus linters that catch real bugs.
# A //nolint must name the linter and say why on the same line (nolintlint enforces it).
version: "2"

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - errorlint   # errors compared with == or formatted with %v instead of wrapped/errors.Is
    - bodyclose   # HTTP response bodies left open
    - gosec       # common security mistakes (path traversal, file modes, weak randomness, overflow)
    - misspell    # typos in comments and strings
    - unconvert   # conversions to the type a value already has
    - copyloopvar # loop-variable copies made redundant by Go 1.22
    - nolintlint  # every //nolint must name a linter and give a reason
  settings:
    nolintlint:
      require-specific: true
      require-explanation: true
    misspell:
      ignore-rules:
        - mosquitto # the MQTT broker, not a typo
    staticcheck:
      # golangci-lint's default set, minus QF1001: "!(a-z || A-Z || 0-9)" reads as the
      # character class it is; the De Morgan rewrite is harder to check by eye.
      checks: ["all", "-ST1000", "-ST1003", "-ST1016", "-ST1020", "-ST1021", "-ST1022", "-QF1001"]
  exclusions:
    rules:
      # Tests build fixture paths and write throwaway files under t.TempDir;
      # gosec's file-path and file-mode rules flag that by design.
      - path: _test\.go
        linters: [gosec]

formatters:
  enable:
    - gofmt
