# Local broker for Setting 1 (own observer). Password auth only.
listener 1883
allow_anonymous false
password_file /mosquitto/data/pw
# Queued QoS 1 messages survive a broker restart (saved every 60 s and on shutdown).
persistence true
persistence_location /mosquitto/data/
autosave_interval 60
max_queued_messages 10000
# Unacked QoS 1 in flight per client; must stay below the ingester's 1024-slot queue.
max_inflight_messages 20
log_dest stdout
